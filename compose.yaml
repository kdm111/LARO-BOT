# `docker compose` reads this to *run* our containers (runtime).
# Each Dockerfile (build/*.Dockerfile) describes how to *build* one image.
name: singlearm

services:
  # ---- agent: LLM planning + recovery + sequential executor (ROS 2 action client) ----
  agent:
    build:
      context: .                       # build can see the whole repo
      dockerfile: docker/agent.Dockerfile
    image: singlearm/agent:dev
    container_name: singlearm-agent
    init: true                         # real PID 1 (tini) so signals/Ctrl-C behave
    volumes:
      - ./:/ws                         # bind-mount repo -> host edits are live inside
    working_dir: /ws
    environment:
      ROS_DOMAIN_ID: "48"
      # llm_planner가 읽는 값. 2026-08-12부터 LLM은 항상 네트워크 너머다(pod ollama).
      # pod ID는 재생성마다 바뀌므로 파일에 박지 않고 레포 루트 .env에서 받는다:
      #   OLLAMA_HOST=https://<POD_ID>-11434.proxy.runpod.net
      # 이 한 줄 덕분에 파이썬 코드는 로컬/컨테이너 어디서 돌든 그대로다.
      OLLAMA_HOST: ${OLLAMA_HOST:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - singlearm

  # ---- ollama 서비스는 2026-08-12에 제거했다 (infra.md I8) ----
  # LLM은 이제 원격 pod에서 돈다. sim에서든 실기에서든 항상 네트워크 너머라
  # 로컬 스택에 추론 서버를 둘 자리가 없다 -> agent의 OLLAMA_HOST 한 줄이 경계다.
  # 되돌리려면 git history에서 이 자리의 ollama 서비스 + ollama_models 볼륨을 꺼내온다.

  sim:
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    image: singlearm/sim:dev
    container_name: singlearm-sim
    init: true
    volumes:
      - ./:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # 호스트의 X 서버 소켓 -> GUI 창이 뜬다.
    working_dir: /ws
    environment:
      ROS_DOMAIN_ID: "48"
      DISPLAY: ${DISPLAY}
      # 기본값은 compute,utility 뿐이라 OpenGL이 안 넘어온다.
      # 이게 없으면 Gazebo/RViz가 llvmpipe(소프트웨어)로 떨어져 RTF가 주저앉는다.
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - singlearm
  moveit:
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    image: singlearm/sim:dev
    container_name: singlearm-moveit
    depends_on:
      - sim
    init: true
    volumes:
      - ./:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /ws
    environment:
      ROS_DOMAIN_ID: "48"
      DISPLAY: ${DISPLAY}
      NVIDIA_DRIVER_CAPABILITIES: "all"   # sim과 같은 이유 (RViz/MoveIt 시각화)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - singlearm

# User-defined bridge network. ROS 2's default DDS discovery (multicast) works
# between containers that share one of these networks — that's how agent/motion/
# perception will find each other once we add them.
networks:
  singlearm:
    driver: bridge
