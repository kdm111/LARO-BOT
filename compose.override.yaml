# 이 머신 전용 오버라이드 (docker compose가 자동으로 읽는다).
# 이 PC의 GPU는 GeForce GT 730(GK208, compute capability 3.5)이다.
# ollama가 요구하는 최소치는 5.0 -> GPU 가속 불가. 게다가 Kepler는 최신 NVIDIA 드라이버에서 지원이 끊겼다.
# compose.yaml의 nvidia device reservation을 그대로 두면
# "could not select device driver nvidia" 로 up이 실패하므로 여기서 비운다.
# GPU 있는 머신으로 옮기면 이 파일만 지우면 원래대로 돌아간다.
#
# 빈 리스트(devices: [])로는 안 지워진다 — compose 병합이 빈 시퀀스를 무시한다.
# Compose 스펙의 !reset 태그로 deploy 블록을 통째로 없앤다.
services:
  ollama:
    deploy: !reset null
