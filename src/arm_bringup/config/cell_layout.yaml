# 셀 구역 배치 — ★ 이 파일이 진실이다.
#
# 같은 숫자가 세 곳에 더 있다(cell.py ZONE / params.hpp kTargets / scene_*.sdf).
# 언어가 파이썬·C++·XML로 달라 한 곳을 import 할 수 없어서, 대신 이 파일을 기준으로
# 세 곳이 같은지 검사하는 테스트를 둔다 : arm_agent/agent/test_cell_layout.py
# 하나만 고치면 pytest가 빨개진다. 조용히 어긋나면 "정리했는데 계속 다시 정리한다"
# 같은 엉뚱한 증상으로 나타나기 때문이다(2026-08-15 실측).
#
# M6(실물)에서는 가제보가 사라지고 구역은 자로 잰 값이 된다. 그때도 이 파일은 남고
# 노드가 파라미터로 읽게 된다 - SDF가 진실이 될 수 없는 이유다.
#
# 좌표계 : base_link 기준, 단위 m. +x = 카메라에서 먼 쪽(화면 위), +y = 왼쪽.
# 각 구역은 사각형 [x0, x1] x [y0, y1] 이고, place 목적지는 그 중심이다.
#
# ★ 2026-08-15 재설계 — 구역 사이에 틈을 뒀다.
#   구 배치는 정사각형을 x로 반 갈라 counter x[0.035,0.085] / bin x[0.085,0.135]가
#   0.085 선을 공유했다. 그런데 놓기 오차가 3.3cm 나서(목표 (0.060,-0.145) ->
#   실제 (0.087,-0.164)) 카운터에 시킨 물건이 수거함으로 판정됐다.
#   틈이 0이면 오차가 그대로 오판이 된다.
#
# ★ 2026-08-19 실물 반영 — 놓기 구역 넷을 x 중심 0.085 -> 0.140 으로 앞당겼다.
#   왜: 실물 카메라는 팔 뒤 12cm 에서 38도로 비스듬히 본다. x=0.085 는 화면 아래
#   가장자리라 렌즈 왜곡이 가장 크고(왜곡계수를 아직 0으로 두고 있다),
#   counter 에 놓은 블록을 detector 가 10cm 어긋나게 봤다(2026-08-19 실측).
#   화면 중앙은 world x=0.274 에 떨어지므로 5.5cm 앞당기면 왜곡이 줄어든다.
#   대가: 3D 시차로 인한 중심 밀림이 12.9 -> 17mm 로 는다(밀림 = 0.02/tan(내려보는각)).
#   사각형 폭(8x6cm)과 구역 사이 틈은 그대로 두었다 - 아래 근거가 그대로 유효하다.
#
# ★ 크기 근거 (2026-08-15 IK 격자 훑기, phi=-90도, yaw -90~+90 전부, z=0.02와 z=0.10 양쪽)
#   놓을 수 있는 부채꼴은 |y|가 커질수록 급히 좁아진다 :
#     |y|=0.06 -> x 최대 0.235 | 0.10 -> 0.223 | 0.15 -> 0.193
#     |y|=0.17 -> x 최대 0.178 | 0.21 -> 0.130 | 0.25 -> 0.035
#   그래서 x로 가르지 않고 y로 가른다. x는 8cm를 통으로 쓰고 y를 6cm씩 두 칸으로
#   나누되 사이를 3cm 비운다. 물체(6cm)가 틈에 떨어지면 어느 구역도 아니게 되어
#   "놓긴 놓았는데 어디인지 모른다"가 되고, 그건 오판이 아니라 정직한 실패다.
#   양옆 네 칸(창고·카운터·수거함)은 전부 8.0 x 6.0으로 같다.
#
# ★ 위 문단은 2026-08-20 저녁 이전의 배치를 설명한다. 그날 저녁 실물을 보며
#   구역을 다시 잡으면서 숫자가 전부 바뀌었다. 지금 배치는 넷이다 :
#     work    가운데 종이를 안쪽으로 들인 것 (5.5 x 19.7cm)
#     shelf   왼쪽 종이 위 (5 x 3cm)
#     counter 오른쪽 종이 위 (5 x 3cm)
#     bin     종이 밖 오른쪽 구석 (5 x 3cm)
#   shelf·counter·bin 의 중심은 사용자가 blue_ring 을 놓아 자리를 표시하고 그
#   검출 좌표를 읽어서 잡았다. 각 구역 주석에 그날의 실측이 남아 있다.

zones:
  # 창고 — ★ 2026-08-19 실물에서 shelf_block/shelf_ring 을 하나로 합쳤다(사용자 결정).
  # blue_ring 이 M6 마감 범위 밖(M6_real.md §13)이라 창고를 둘로 나눌 이유가 없어졌고,
  # 부채꼴이 |y| 0.19 에서 x 최대 0.16 이라 왼쪽에 두 구역을 넣을 자리도 없다.
  # 위치: 중심 (0.110, 0.185). 옛 shelf_block 을 실물에서 바깥으로 옮긴 자리다.
  #   왜 바깥인가: 실물 카메라가 팔 뒤 12cm 에서 38도로 비스듬히 보는데, x 가 작으면
  #   화면 아래 가장자리라 렌즈 왜곡이 가장 크다(왜곡계수를 아직 0으로 둔다).
  #   옛 자리(0.085)에 놓은 블록을 detector 가 10cm 어긋나게 봤다 - 앞당기니 2~3cm 로 줄었다.
  # ★ 08-19 2차 조정: y 중심 0.165 -> 0.185 (사용자가 실물을 보고 조금 더 바깥으로).
  #
  # ★ 2026-08-20 저녁 3차 - 중심 (0.110, 0.185) -> (0.154, 0.133), 크기 8x6 -> 5x3cm.
  #   중심은 work 때와 같은 방법으로 잡았다: 사용자가 blue_ring 을 놓아 자리를 표시하고
  #   그 검출 좌표를 읽었다(5프레임 x 0.1532~0.1543, y 0.1329~0.1338, 흔들림 1mm 이하).
  #   크기를 줄인 이유는 높이다. 8x6 을 그대로 두면 먼-왼쪽 모서리 (0.194, 0.163)이
  #   z 0.10 부터 도달 불가라 trace_zone 을 work 와 같은 0.12 로 못 돌린다.
  #   같은 날 실측(중심 고정, 크기만 줄여 z=0.12 에서 네 모서리 검사):
  #     8x6 X | 7x5 X | 6x4 X | 5x4 X | 5x3 O
  #   그래서 5x3 이다. 08-19 주석의 "바깥 모서리가 도달 밖"이라는 문제도 같이 사라졌다 -
  #   네 모서리가 전부 도달 안이다(그 주석이 말한 "동작에는 문제가 없다"에 기대지 않아도 된다).
  #   ※ 5x3cm 은 블록(4x6cm)보다 작다. 구역은 물체의 "중심"이 어디 있는가로만 가르고
  #     place 는 중심 한 점으로 가므로 동작에는 문제가 없다. 다만 블록을 눈으로 보면
  #     구역 판 밖으로 몸이 삐져나온다 - 그건 정상이다.
  # ★ 2026-08-20 y 중심 0.133 -> 0.153 (사용자가 실물을 보고 2cm 왼쪽으로).
  #   창고에서 집을 때 팔이 블록에 못 미쳐 쓰러뜨린 뒤의 조정이다.
  # ★ 2026-08-22 y 중심 0.153 -> 0.123 (사용자 결정 : 오른쪽으로 3cm).
  #   place 착지가 목표보다 오른쪽에 앉는 +y 영역 팔 편향의 실측 대응 -
  #   조준을 트림하는 대신 구역을 팔이 실제로 놓는 자리로 옮겼다.
  #   work 왼쪽 끝도 같이 3cm 안으로 들여 틈 3cm 를 유지한다.
  # ★ 2026-08-22 x [0.129,0.179] -> [0.115,0.165] (로봇 쪽으로 1.4cm).
  #   +y 팔 편향 보정(+5.5cm)을 얹으면 실효 조준 r=0.246 으로 lift 도달 밖이었다
  #   - 사전 도달 체크가 거부. x 를 들여 r=0.225 로 여유를 만든다.
  shelf:
    x: [0.115, 0.165]
    y: [0.108, 0.138]
    place_target: true

  # 작업 구역 — 여기 놓인 물체가 정리 대상이다.
  # ★ 2026-08-20 저녁 실물 재정의(사용자 결정). work_near/work_far 두 칸을 없애고,
  #   책상에 깔린 A4 용지 석 장 중 "가운데 한 장"을 그대로 작업 구역으로 삼는다.
  #   왜: 구역을 눈에 보이는 물건에 맞춰야 사람이 자를 대지 않고도 경계를 안다.
  #   같은 날 낮의 두 칸 분할은 여기서 되돌린다.
  #
  #   중심 = 그 종이 한가운데 놓여 있던 blue_ring 의 검출 좌표(2026-08-20 실측).
  #     6프레임 x=0.1565~0.1576, y=0.0146~0.0147 (흔들림 1mm) -> (0.157, 0.015)
  #     ※ 링은 그 뒤 사람이 치웠다. 중심은 링이 아니라 "종이"의 중심이고 종이는
  #       그대로이므로 값은 살아 있다. 링은 자를 대신 쓴 표식이었을 뿐이다.
  #   처음 크기 = 종이 실치수 그대로 : 가로(y) A4 긴 변 전부 0.297 /
  #     세로(x) A4 짧은 변의 절반 0.105. 종이는 가로놓기다(긴 변 297mm 이 y축과 나란함).
  #     교차검증도 됐다 - 좌우 이웃 종이 위의 red_block(y=+0.164)·green_block(y=-0.159)이
  #     둘 다 그 사각형의 y 경계(+0.1635/-0.1335) 바로 바깥에 떨어졌다.
  #
  # ★ 2026-08-20 저녁, 실물을 보며 세 번에 걸쳐 줄였다(사용자 결정). 종이 실치수 ->
  #   ① 사방 1cm 안으로   : x 0.085 / y 0.277  ("전체적으로 너무 크다")
  #   ② 다시 사방 1.5cm   : x 0.055 / y 0.247  ("3cm 더 줄이면 될 거 같아")
  #   ③ y 만 비대칭으로   : 왼쪽(+y) 변 3cm, 오른쪽(-y) 변 2cm 추가로 안쪽으로.
  #                         팔이 왼쪽으로 갈 때가 가장 무리였다.
  #   최종 x 0.055 / y 0.197. ③에서 y 중심이 0.015 -> 0.010 으로 5mm 옮겨졌다
  #   (양쪽을 다르게 줄였으니 당연한 결과다. x 중심 0.157 은 그대로).
  #
  #   왜 줄이면 좋은가: 구역이 클수록 먼 꼭지점이 멀어지고, 멀수록 팔을 올릴 수 있는
  #   높이가 준다. 같은 날 실측(먼-왼쪽 꼭지점 = 이 구역에서 가장 먼 점, elbow=down):
  #     종이 실치수 -> z 0.04까지 | ① -> 0.08 | ② -> 0.12 | ③(지금) -> 0.14
  #   ③에서 z 0.16 은 먼-왼쪽만 도달 불가로 빠진다. trace_zone 은 여유를 두고 0.12 를 쓴다.
  #   ★ 구역을 다시 넓히면 그 높이를 반드시 같이 낮출 것. 안 그러면 먼 꼭지점 하나만
  #     조용히 빠지고 나머지 셋만 짚는다 - "네 점 다 됐다"로 보이지 않는 실패다.
  #
  # ⚠️ 되돌아온 부작용 — place 목적지가 다시 중심 한 점이다. 블록 두 개를 work 로
  #   되돌리면 둘째가 첫째 위로 내려간다. 낮에 두 칸으로 가른 이유가 이것이었고,
  #   아직 안 푼 채로 둔다.
  # 겹침 — 없다. shelf 겹침은 ① 에서, counter 겹침은 counter 를 오른쪽 종이로
  #   옮기면서(중심 -0.085 -> -0.156) 풀렸다. test_zones_do_not_overlap 이 지킨다.
  # ★ 2026-08-22 왼쪽 끝 0.1085 -> 0.078 (shelf 이동에 맞춰 틈 3cm 유지).
  work:
    x: [0.1295, 0.1845]
    y: [-0.0885, 0.078]
    place_target: true

  # 카운터 — 주문의 종착지. 손님이 받아가는 자리.
  # ★ 2026-08-20 저녁, shelf 와 같은 방법·같은 크기로 다시 잡았다(사용자 결정).
  #   옛 자리 (0.140, -0.085) 8x6cm 은 버렸다 - work 를 실물 종이에 맞추고 나니
  #   그 사각형과 5.05x3.35cm 겹쳤다. 지금 자리는 겹치지 않는다.
  #   중심은 사용자가 blue_ring 을 놓아 표시한 자리의 검출 좌표다
  #   (5프레임 전부 x=0.1543, y=-0.1355 로 동일. 흔들림 0).
  #   z=0.06 에서는 8x6 도 네 모서리가 다 도달한다 - 5x3 으로 줄인 것은 도달 때문이
  #   아니라 shelf 와 같은 규격으로 맞추기 위해서다.
  #   ※ 5x3cm 이 블록(4x6cm)보다 작은 것에 대한 설명은 위 shelf 주석과 같다.
  #   ※ 저녁 한때 이 구역을 bin 으로 부르고 counter 를 아예 지웠다가, 이름을 counter 로
  #     되돌리고 bin 은 아래처럼 종이 밖으로 내보내는 것으로 정리됐다. 그 덕에
  #     TARGET_IDS 가 셋으로 원복되어 eval 시험지의 'bin' 69곳을 손대지 않아도 됐다.
  # ★ 2026-08-20 y 중심 -0.136 -> -0.156 (사용자가 실물을 보고 2cm 오른쪽으로).
  #   같은 날 실측: 목표 (0.154,-0.136) 에 놓으라 했더니 (0.1251,-0.1704) 에 떨어졌다
  #   (Δx -2.9cm, Δy -3.4cm). 이 옮김은 그 오차를 보정한 게 아니라 자리 자체를
  #   옮긴 것이다 - 보정하려면 오차가 일정한 옵셋인지부터 두 점 이상으로 확인해야 한다.
  counter:
    x: [0.129, 0.179]
    y: [-0.171, -0.141]
    place_target: true

  # 수거함 — 불량품을 버리는 자리.
  # ★ 2026-08-20 저녁 종이 밖으로 내보냈다(사용자 결정 : "아예 종이 밖으로,
  #   카운터 밑 겹치지 않도록 오른쪽 구석, 카메라에 걸치는 부분으로").
  #   중심 (0.140, -0.175) -> (0.070, -0.225) -> (0.060, -0.225).
  #   마지막 1cm 는 실제로 green_block 을 넣어 보고 사용자가 "조금만 더 숙여서"라고
  #   해서 x 를 내린 것이다(화면 아래쪽 = x 작은 쪽). 크기는 shelf·counter 와 같은 5x3cm.
  #   버리는 자리를 작업하는 종이 위에 두지 않는다는 뜻이다 - 창고(왼쪽 종이)와
  #   카운터(오른쪽 종이)는 종이 위에 있고, 수거함만 그 바깥이다.
  #
  #   자리를 고른 근거 (2026-08-20 실측, z=0.06 elbow=down 격자 훑기):
  #     - 도달 한계 : x<=0.08 이면 y=-0.25 까지, x=0.10~0.12 면 y=-0.23 까지.
  #     - 시야 한계 : |y| 0.255 (HFOV 60도). 이 밖이면 카메라가 못 본다.
  #   두 한계가 거의 같은 자리에서 끝난다. 그래서 바깥 끝을 |y|=0.240 에 두었다 -
  #   시야 한계에서 1.5cm 안쪽, 즉 "카메라에 걸치는" 자리다. 네 모서리 모두 도달한다.
  #   counter 와는 5.9cm 떨어져 있다(counter y 하한 -0.151 vs 여기 y 상한 -0.210).
  #
  # ⚠️ 시야가 이 구역의 진짜 제약이다. place 성공 판정(placed_in)은 놓은 물체가
  #   씬에 다시 보이는지로 하는데, 여기서 조금만 더 바깥으로 나가면 카메라가 못 보고
  #   성공한 place 가 "떨어뜨림"으로 판정된다. 구역을 더 밖으로 밀지 말 것.
  # ★ 2026-08-22 중심 (0.060,-0.225) -> (0.054,-0.134) (사용자 결정 : 팔이 실제로
  #   놓는 자리로. 구석 자리는 착지가 2~3.5cm 못 미쳤고 왜곡·시야 한계 논쟁도 있던
  #   자리다 - 08-20 방식대로 물체를 그 자리에 두고 검출 좌표를 읽어 잡았다).
  #   counter 와 y 는 겹치지만 x 가 5cm 떨어져 사각형 겹침은 없다.
  bin:
    x: [0.029, 0.079]
    y: [-0.149, -0.119]
    place_target: true
