# 셀 구역 배치 — ★ 이 파일이 진실이다.
#
# 같은 숫자가 세 곳에 더 있다(agent.py ZONE / skill_server.cpp kTargets / scene_*.sdf).
# 언어가 파이썬·C++·XML로 달라 한 곳을 import 할 수 없어서, 대신 이 파일을 기준으로
# 세 곳이 같은지 검사하는 테스트를 둔다 : arm_agent/agent/test_cell_layout.py
# 하나만 고치면 pytest가 빨개진다. 조용히 어긋나면 "정리했는데 계속 다시 정리한다"
# 같은 엉뚱한 증상으로 나타나기 때문이다(2026-08-15 실측).
#
# M6(실물)에서는 가제보가 사라지고 구역은 자로 잰 값이 된다. 그때도 이 파일은 남고
# 노드가 파라미터로 읽게 된다 - SDF가 진실이 될 수 없는 이유다.
#
# 좌표계 : base_link 기준, 단위 m. +x = 카메라에서 먼 쪽(화면 위), +y = 왼쪽.
# 각 구역은 사각형 [x0, x1] x [y0, y1] 이고, place 목적지는 그 중심이다.
#
# ★ 크기 근거 (2026-08-15 IK 격자 훑기, phi=-90도) :
#   사용 가능 영역 = 「IK 도달」 ∩ 「카메라 시야」 ∩ 「반경 0.10 바깥」
#   - 닿는 반경이 높이에 따라 준다. z=0.08(집기 접근)에서 y=0이면 x 0.250,
#     |y|=0.16이면 0.195. z=0.10(놓고 물러나기)에서는 각각 0.240 / 0.185.
#   - 시야 한계는 |y| 0.255 (HFOV 60도).
#   - 안쪽 벽은 없다. r=0.10에서도 팔이 도달해 파지를 시도했다(실측).
#   배치는 「큰 정사각형 셋」이다 - 창고(+y) / 작업(가운데) / 카운터·수거함(-y).
#   양옆 둘은 각각 반으로 갈라 두 구역이 되고, 안쪽이 블록/카운터, 바깥(x 큰 쪽)이 링/수거함이다.
#   각 정사각형은 그 자리에서 가능한 최대다 : 옆 10.0x10.0, 가운데 13.0x13.0.
#   옆이 더 작은 것은 부채꼴이 |y|가 클수록 좁아지기 때문이다.

zones:
  # 링 창고 — 블록 창고 바로 위(x 큰 쪽). 바깥이라 부채꼴이 좁다.
  # 블록 창고가 x를 내주고 이쪽이 받았다 - 구역은 물체 중심만 판정하므로
  # 블록 두 개의 중심(x 0.060 / 0.085)만 들어가면 창고는 좁아도 된다.
  shelf_ring:
    x: [0.085, 0.135]
    y: [0.095, 0.195]
    place_target: true

  # 블록 창고 — 빨강과 초록이 같이 선다. y로 길게 잡아 둘을 세운다.
  shelf_block:
    x: [0.035, 0.085]
    y: [0.095, 0.195]
    place_target: true

  # 작업 구역 — 여기 놓인 물체가 정리 대상이다. 물체 셋이 들어가야 해서 제일 넓다.
  # place 목적지가 아니다. 물건은 여기서 나가기만 한다.
  work:
    x: [0.100, 0.230]
    y: [-0.065, 0.065]
    place_target: false

  # 카운터 — 주문의 종착지. 손님이 받아가는 자리.
  counter:
    x: [0.035, 0.085]
    y: [-0.195, -0.095]
    place_target: true

  # 수거함 — 불량품을 버리는 자리. 카운터 바로 위(x 큰 쪽).
  bin:
    x: [0.085, 0.135]
    y: [-0.195, -0.095]
    place_target: true
